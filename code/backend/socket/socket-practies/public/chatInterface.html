<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Open Room | Chat</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		:root { --ink: #172126; --muted: #718087; --line: #e5e9e8; --mint: #c8f284; --paper: #f7f8f5; --white: #fff; --coral: #f07862; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); background: #dfe9e3; font-family: "DM Sans", sans-serif; }
		.shell { width: min(1120px, 100%); min-height: 100vh; margin: auto; padding: 32px; display: grid; place-items: center; }
		.app { width: 100%; height: min(760px, calc(100vh - 64px)); min-height: 560px; display: grid; grid-template-columns: 300px 1fr; overflow: hidden; background: var(--white); border: 1px solid rgba(23,33,38,.1); box-shadow: 0 24px 70px rgba(30, 55, 50, .16); }
		aside { padding: 30px 24px; color: #edf4ed; background: var(--ink); display: flex; flex-direction: column; }
		.brand { font: 700 24px "Space Grotesk", sans-serif; letter-spacing: 0; }
		.brand span { color: var(--mint); }
		.intro { margin: auto 0; }
		.intro h1 { max-width: 220px; margin: 0 0 16px; font: 600 38px/1.05 "Space Grotesk", sans-serif; letter-spacing: 0; }
		.intro p { color: #9eaeaa; line-height: 1.6; }
		.room { margin-top: 28px; padding: 16px; border: 1px solid #3a4b4c; }
		.room-label { margin-bottom: 8px; color: #9eaeaa; font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
		.room strong { font: 600 16px "Space Grotesk", sans-serif; }
		main { min-width: 0; background: var(--paper); display: flex; flex-direction: column; }
		header { min-height: 88px; padding: 22px 30px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(255,255,255,.7); }
		.title h2 { margin: 0 0 5px; font: 600 21px "Space Grotesk", sans-serif; }
		.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
		.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
		.dot.online { background: #72bf65; }
		.online { padding: 10px 13px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
		.messages { flex: 1; overflow-y: auto; padding: 28px 30px; }
		.welcome { margin: 12px auto 30px; max-width: 360px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
		.message { display: flex; gap: 12px; margin: 0 0 20px; animation: rise .25s ease-out; }
		.message.mine { flex-direction: row-reverse; }
		.avatar { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; color: var(--ink); background: var(--mint); font: 700 12px "Space Grotesk", sans-serif; }
		.message.mine .avatar { background: var(--coral); color: white; }
		.bubble-wrap { max-width: min(75%, 500px); }
		.meta { margin: 0 0 6px; color: var(--muted); font-size: 11px; }
		.message.mine .meta { text-align: right; }
		.bubble { padding: 12px 15px; background: var(--white); border: 1px solid var(--line); line-height: 1.45; overflow-wrap: anywhere; }
		.message.mine .bubble { color: #162018; background: var(--mint); border-color: var(--mint); }
		.system { margin: 18px 0; color: var(--muted); text-align: center; font-size: 11px; }
		form { padding: 18px 30px 24px; border-top: 1px solid var(--line); background: var(--white); }
		.composer { display: flex; gap: 10px; padding: 6px 6px 6px 16px; border: 1px solid #d8dfdc; background: var(--paper); }
		input { min-width: 0; flex: 1; padding: 10px 0; border: 0; outline: 0; color: var(--ink); background: transparent; font: inherit; }
		button { padding: 0 20px; border: 0; color: var(--ink); background: var(--mint); font: 700 13px "Space Grotesk", sans-serif; cursor: pointer; }
		button:hover { background: #b5e56c; }
		.name-modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(23,33,38,.55); }
		.name-box { width: min(390px, 100%); padding: 30px; background: var(--white); box-shadow: 0 20px 60px rgba(0,0,0,.2); }
		.name-box h2 { margin: 0 0 8px; font: 600 27px "Space Grotesk", sans-serif; }
		.name-box p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
		.name-box form { padding: 0; border: 0; }
		.name-box input { width: 100%; padding: 13px; border: 1px solid var(--line); background: var(--paper); }
		.name-box button { width: 100%; min-height: 45px; margin-top: 10px; }
		@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 700px) { .shell { padding: 0; } .app { height: 100vh; min-height: 0; grid-template-columns: 1fr; } aside { display: none; } header, form { padding-left: 18px; padding-right: 18px; } .messages { padding: 22px 18px; } .bubble-wrap { max-width: 82%; } }

		#chatApp {
			width: min(760px, calc(100% - 32px));
			height: min(720px, calc(100vh - 48px));
			min-height: 460px;
			margin: 24px auto;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			background: var(--paper);
			border: 1px solid rgba(23, 33, 38, .12);
			box-shadow: 0 24px 70px rgba(30, 55, 50, .16);
		}

		#mainSection {
			min-height: 0;
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 18px;
			padding: 28px;
			overflow-y: auto;
			background: var(--paper);
		}

		#left-senderText,
		#right-receiverText {
			width: fit-content;
			max-width: min(75%, 500px);
			min-height: 42px;
			padding: 12px 15px;
			line-height: 1.45;
			overflow-wrap: anywhere;
			border: 1px solid var(--line);
			background: var(--white);
			animation: rise .25s ease-out;
		}

		#left-senderText {
			align-self: flex-end;
			color: #162018;
			background: var(--mint);
			border-color: var(--mint);
		}

		#right-receiverText {
			align-self: flex-start;
		}

		.typeicon {
			position: relative;
			align-self: flex-start;
			width: 44px;
			height: 26px;
			margin-top: auto;
			border: 0;
			background: var(--ink);
		}

		.typeicon::before,
		.typeicon::after {
			position: absolute;
			top: 10px;
			width: 5px;
			height: 5px;
			border-radius: 50%;
			background: var(--white);
			content: "";
			animation: typing-dot 1.2s infinite ease-in-out;
		}

		.typeicon::before {
			left: 10px;
			box-shadow: 9px 0 0 var(--white);
		}

		.typeicon::after {
			left: 28px;
			animation-delay: .2s;
		}

		@keyframes typing-dot {
			0%, 60%, 100% { opacity: .35; transform: translateY(0); }
			30% { opacity: 1; transform: translateY(-3px); }
		}

		#chatApp > form {
			margin: 0;
			padding: 18px 28px 24px;
			border-top: 1px solid var(--line);
			background: var(--white);
		}

		#fromDiv {
			display: flex;
			gap: 10px;
			padding: 6px 6px 6px 16px;
			border: 1px solid #d8dfdc;
			background: var(--paper);
		}

		#userText {
			width: 100%;
			min-height: 40px;
			padding: 10px 0;
			border: 0;
			outline: 0;
			color: var(--ink);
			background: transparent;
			font: inherit;
		}

		#userText::placeholder {
			color: var(--muted);
		}

		#fromDiv button {
			width: 48px;
			min-height: 40px;
			padding: 0;
			font-size: 13px;
		}

		@media (max-width: 560px) {
			#chatApp {
				width: 100%;
				height: 100vh;
				min-height: 0;
				margin: 0;
				border: 0;
			}

			#mainSection {
				padding: 20px 16px;
			}

			#left-senderText,
			#right-receiverText {
				max-width: 86%;
			}

			#chatApp > form {
				padding: 14px 16px 18px;
			}
		}
	</style>
</head>
<body>
    <div id="chatApp"> 
		<div id="mainSection">
			
			</div>
		<form>  
			<div id="fromDiv">
				<input id="userText" type="text" placeholder="enter your message">
				<button type="submit">send</button>
			</div>
		</form>
	</div>
	<script src="/socket.io/socket.io.js"></script>
	<script>
	const socket = io();
	// select a chatappdiv add event listern on submit 
	// select usetxt to extaract input 

	// once user click on send 
	// create a new dvi id  for showcase in ui is right-receiverText 
	// create a new dvi id  for showcase in ui is left-senderText 
	// select  a mensection div
	//append a this nwely create div in it
	// emit the data to server 
	// check the  socket connection the server 
	// listen a event on the the chanle user:message 
	// if reaceive that event on channle ,prin and 
	// again show back to the connected socket means client 
	// if server send event on particular chancel listen on forented
	// again show the message to the chat interface of the connected socket

	// input elemnt applyin oninpute run fetch vaule , emmiton on server 
	// sever brodcaste it in data
	// on forten its type of typing box signature 




	



	const chatapp= document.getElementById('chatApp')
	const mainSection=document.getElementById('mainSection')
	const userInput=document.getElementById('userText')
	let typingTimer

	chatapp.addEventListener('submit', function(event){
		event.preventDefault()
		const textdata = userInput.value.trim()
		if (!textdata) return

		const senderMessage = document.createElement('div')
		senderMessage.id = 'left-senderText'
		senderMessage.textContent = textdata // setin message in element
		mainSection.appendChild(senderMessage)
		userInput.value=''
		clearTimeout(typingTimer)
		socket.emit('user:typing','')
		socket.emit('user:message',textdata)
	

	})
	

	userInput.addEventListener('input',(event)=>{

		const value=event.target.value
		socket.emit('user:typing',value)
		clearTimeout(typingTimer)
		typingTimer = setTimeout(() => {
			socket.emit('user:typing','')
		}, 700)

	})
	socket.on('server:message',(data)=>{
		console.log('server message is', data)
		const senderMessage= document.createElement('div')
		senderMessage.id='left-senderText'
		senderMessage.textContent=data
		mainSection.appendChild(senderMessage)

	
	})
	socket.on('server:typing',(data)=>{
		let typingBox = mainSection.querySelector('.typeicon')

		if (!data) {
			typingBox?.remove()
			return
		}

		if (!typingBox) {
			typingBox = document.createElement('div')
			typingBox.classList.add('typeicon')
			mainSection.appendChild(typingBox)
		}

	})



	

	</script>
	
</body>
</html>
