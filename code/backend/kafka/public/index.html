<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>location tracker</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <style>
        #map { height: 90vh; }

     </style>
</head>
<body>
     <div id="map"></div>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>   
     <script>
      const socket=io()
    var map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
let remoteMarker= new Map()
socket.on('server:location:update', (data)=>{
    const {lat, lng, id}=data;
    if(!remoteMarker.has(id)){
        const marker = L.marker([lat, lng]).addTo(map)
            .bindPopup(`User ${id}`)
            .openPopup();
        remoteMarker.set(id, marker);
    } else{
        const marker = remoteMarker.get(id);
        marker.setLatLng([lat, lng])

    }

    })

  function onLocationFound() {
    return new Promise((resolve, reject)=>{
        // Check if geolocation is supported by the browser
if ("geolocation" in navigator) {
  // Prompt user for permission to access their location
  navigator.geolocation.getCurrentPosition(
    // Success callback function
    (position) => {
      // Get the user's latitude and longitude coordinates
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      // Do something with the location data, e.g. display on a map
      console.log(`Latitude: ${lat}, longitude: ${lng}`);

      resolve({lat, lng})
    },
    // Error callback function
    (error) => {
      // Handle errors, e.g. user denied location sharing permissions
      reject(error);
    //   console.error("Error getting user location:", error);
    }
  );
} else {
  // Geolocation is not supported by the browser
  console.error("Geolocation is not supported by this browser.");
}
    })

  }
  let updatedLocation=null;
  // onLocationFound().then((data)=>{console.log(data)})
  async function main(){
    setInterval(async()=>{
        const {lat, lng} = await onLocationFound()

        socket.emit('client:location:update', {lat, lng})
        map.invalidateSize()  // Invalidate the map size to ensure it is displayed correctly
        map.setView([lat, lng], 13);
        if(!updatedLocation){
           updatedLocation = L.marker([lat, lng]).addTo(map)
                .bindPopup('You are here!')
                .openPopup();
        } else{
            updatedLocation.setLatLng([lat, lng])
        }
    }, 5000)
  }
  window.addEventListener('load', main)
</script>
</body>
</html>
