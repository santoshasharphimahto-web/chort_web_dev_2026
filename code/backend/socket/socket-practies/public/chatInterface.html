<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Open Room | Chat</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		:root { --ink: #172126; --muted: #718087; --line: #e5e9e8; --mint: #c8f284; --paper: #f7f8f5; --white: #fff; --coral: #f07862; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); background: #dfe9e3; font-family: "DM Sans", sans-serif; }
		.shell { width: min(1120px, 100%); min-height: 100vh; margin: auto; padding: 32px; display: grid; place-items: center; }
		.app { width: 100%; height: min(760px, calc(100vh - 64px)); min-height: 560px; display: grid; grid-template-columns: 300px 1fr; overflow: hidden; background: var(--white); border: 1px solid rgba(23,33,38,.1); box-shadow: 0 24px 70px rgba(30, 55, 50, .16); }
		aside { padding: 30px 24px; color: #edf4ed; background: var(--ink); display: flex; flex-direction: column; }
		.brand { font: 700 24px "Space Grotesk", sans-serif; letter-spacing: 0; }
		.brand span { color: var(--mint); }
		.intro { margin: auto 0; }
		.intro h1 { max-width: 220px; margin: 0 0 16px; font: 600 38px/1.05 "Space Grotesk", sans-serif; letter-spacing: 0; }
		.intro p { color: #9eaeaa; line-height: 1.6; }
		.room { margin-top: 28px; padding: 16px; border: 1px solid #3a4b4c; }
		.room-label { margin-bottom: 8px; color: #9eaeaa; font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
		.room strong { font: 600 16px "Space Grotesk", sans-serif; }
		main { min-width: 0; background: var(--paper); display: flex; flex-direction: column; }
		header { min-height: 88px; padding: 22px 30px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(255,255,255,.7); }
		.title h2 { margin: 0 0 5px; font: 600 21px "Space Grotesk", sans-serif; }
		.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
		.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
		.dot.online { background: #72bf65; }
		.online { padding: 10px 13px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
		.messages { flex: 1; overflow-y: auto; padding: 28px 30px; }
		.welcome { margin: 12px auto 30px; max-width: 360px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
		.message { display: flex; gap: 12px; margin: 0 0 20px; animation: rise .25s ease-out; }
		.message.mine { flex-direction: row-reverse; }
		.avatar { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; color: var(--ink); background: var(--mint); font: 700 12px "Space Grotesk", sans-serif; }
		.message.mine .avatar { background: var(--coral); color: white; }
		.bubble-wrap { max-width: min(75%, 500px); }
		.meta { margin: 0 0 6px; color: var(--muted); font-size: 11px; }
		.message.mine .meta { text-align: right; }
		.bubble { padding: 12px 15px; background: var(--white); border: 1px solid var(--line); line-height: 1.45; overflow-wrap: anywhere; }
		.message.mine .bubble { color: #162018; background: var(--mint); border-color: var(--mint); }
		.system { margin: 18px 0; color: var(--muted); text-align: center; font-size: 11px; }
		form { padding: 18px 30px 24px; border-top: 1px solid var(--line); background: var(--white); }
		.composer { display: flex; gap: 10px; padding: 6px 6px 6px 16px; border: 1px solid #d8dfdc; background: var(--paper); }
		input { min-width: 0; flex: 1; padding: 10px 0; border: 0; outline: 0; color: var(--ink); background: transparent; font: inherit; }
		button { padding: 0 20px; border: 0; color: var(--ink); background: var(--mint); font: 700 13px "Space Grotesk", sans-serif; cursor: pointer; }
		button:hover { background: #b5e56c; }
		.name-modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(23,33,38,.55); }
		.name-box { width: min(390px, 100%); padding: 30px; background: var(--white); box-shadow: 0 20px 60px rgba(0,0,0,.2); }
		.name-box h2 { margin: 0 0 8px; font: 600 27px "Space Grotesk", sans-serif; }
		.name-box p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
		.name-box form { padding: 0; border: 0; }
		.name-box input { width: 100%; padding: 13px; border: 1px solid var(--line); background: var(--paper); }
		.name-box button { width: 100%; min-height: 45px; margin-top: 10px; }
		@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 700px) { .shell { padding: 0; } .app { height: 100vh; min-height: 0; grid-template-columns: 1fr; } aside { display: none; } header, form { padding-left: 18px; padding-right: 18px; } .messages { padding: 22px 18px; } .bubble-wrap { max-width: 82%; } }
	</style>
</head>
<body>
	<div class="shell"><div class="app">
		<aside><div class="brand">open<span>room</span></div><div class="intro"><h1>Small room.<br>Good talk.</h1><p>A simple space for real-time conversation, shared one message at a time.</p><div class="room"><div class="room-label">Current channel</div><strong># general</strong></div></div></aside>
		<main><header><div class="title"><h2>General chat</h2><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div></div><div class="online"><span id="onlineCount">0</span> online</div></header><section class="messages" id="messages"><div class="welcome">Welcome to the room. Say hello and start the conversation.</div></section><form id="messageForm"><div class="composer"><input id="messageInput" maxlength="500" autocomplete="off" placeholder="Write a message..." aria-label="Message"><button type="submit" aria-label="Send message">Send</button></div></form></main>
	</div></div>
	<div class="name-modal" id="nameModal"><div class="name-box"><h2>Join the room</h2><p>Choose a name to appear in the conversation.</p><form id="nameForm"><input id="nameInput" maxlength="24" required autocomplete="name" placeholder="Your name"><button type="submit">Enter chat</button></form></div></div>
	<script src="/socket.io/socket.io.js"></script>
	<script>
		const socket = io();
		const messages = document.querySelector('#messages');
		const messageInput = document.querySelector('#messageInput');
		const nameModal = document.querySelector('#nameModal');
		const nameInput = document.querySelector('#nameInput');
		let username = '';
		const initials = (name) => name.slice(0, 2).toUpperCase();
		const time = (date) => new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
		function addMessage(message) {
			const row = document.createElement('article'); row.className = `message ${message.username === username ? 'mine' : ''}`;
			row.innerHTML = `<div class="avatar">${initials(message.username)}</div><div class="bubble-wrap"><div class="meta">${message.username} · ${time(message.time)}</div><div class="bubble"></div></div>`;
			row.querySelector('.bubble').textContent = message.text; messages.append(row); messages.scrollTop = messages.scrollHeight;
		}
		socket.on('connect', () => { document.querySelector('#statusDot').classList.add('online'); document.querySelector('#statusText').textContent = 'Connected'; });
		socket.on('disconnect', () => { document.querySelector('#statusDot').classList.remove('online'); document.querySelector('#statusText').textContent = 'Disconnected'; });
		socket.on('online-count', (count) => document.querySelector('#onlineCount').textContent = count);
		socket.on('chat-message', addMessage);
		socket.on('system-message', (text) => { const notice = document.createElement('div'); notice.className = 'system'; notice.textContent = text; messages.append(notice); messages.scrollTop = messages.scrollHeight; });
		document.querySelector('#nameForm').addEventListener('submit', (event) => { event.preventDefault(); username = nameInput.value.trim() || 'Guest'; socket.emit('join-chat', username); nameModal.remove(); messageInput.focus(); });
		document.querySelector('#messageForm').addEventListener('submit', (event) => { event.preventDefault(); if (messageInput.value.trim()) { socket.emit('chat-message', messageInput.value); messageInput.value = ''; messageInput.focus(); } });
	</script>
</body>
</html>
